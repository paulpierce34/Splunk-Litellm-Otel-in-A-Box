receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  splunk_hec:
    endpoint: http://splunk:8088
    token: "${env:HEC_TOKEN}"
    index: llmlab
    source: litellm
    sourcetype: litellm:otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [splunk_hec]
    metrics:
      receivers: [otlp]
      exporters: [splunk_hec]
    logs:
      receivers: [otlp]
      exporters: [splunk_hec]
